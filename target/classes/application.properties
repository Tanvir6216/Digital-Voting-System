# =========================
# Server
# =========================
server.port=8080

# =========================
# MySQL Datasource (XAMPP)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/digital_voting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IMPORTANT: remove dialect warning for old mysql versions:
# If you are using XAMPP MariaDB 10.x, Hibernate will still work without specifying dialect.
# So we keep it OFF (recommended).
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Logging (to see REAL 500 cause)
# =========================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# =========================
# Show error details in response (for debugging)
# =========================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always
